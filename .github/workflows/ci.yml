name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.5"   # troque pela sua versao

      - uses: terraform-linters/setup-tflint@v4

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: terraform validate
        run: |
          for d in foundation/*/; do
            echo "== $d"
            terraform -chdir="$d" init -backend=false -input=false
            terraform -chdir="$d" validate
          done

      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init
          tflint --recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: checkov
        run: |
          pip install checkov
          checkov -d . --framework terraform --quiet
  plan:
    needs: static-checks
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        dir: [00-organization, 01-identity, 03-budgets]
    env:
      TF_VAR_email_user: ${{ secrets.TF_VAR_EMAIL_USER }}
      TF_VAR_email_domain: ${{ secrets.TF_VAR_EMAIL_DOMAIN }}
      TF_VAR_alert_email: ${{ secrets.TF_VAR_ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@v4

      - name: debug claims do token OIDC
        run: |
          python3 - <<'PY'
          import os, json, base64, urllib.request
          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=sts.amazonaws.com"
          req = urllib.request.Request(url, headers={"Authorization": "bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]})
          tok = json.load(urllib.request.urlopen(req))["value"]
          p = tok.split(".")[1]
          p += "=" * (-len(p) % 4)
          c = json.loads(base64.urlsafe_b64decode(p))
          print({k: c.get(k) for k in ["sub", "aud", "iss", "repository", "ref", "event_name"]})
          PY

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: sa-east-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.3"   # a mesma do job anterior

      - name: terraform init
        run: terraform -chdir=foundation/${{ matrix.dir }} init -input=false

      - name: terraform plan
        run: terraform -chdir=foundation/${{ matrix.dir }} plan -input=false -lock=false